<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 5: What can we learn from traveling? | オンデマンド英語学習アプリ</title>
  <meta name="description" content="Unit 5 全問題・スクリプト・音声・録音発音評価付きオンデマンド英語学習Webアプリケーション">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo-group">
        <span class="logo-badge">UNIT 5</span>
        <div>
          <div class="app-title">What can we learn from traveling?</div>
          <div class="app-subtitle">本文学習ノート pp.80-97 完全準拠 オンデマンド英語学習</div>
        </div>
      </div>
      <div class="header-controls">
        <div id="header-stats" class="stats-badge">
          🎯 記録: 読み込み中...
        </div>
        <button id="theme-toggle" class="btn-icon" title="テーマ切り替え" aria-label="テーマ切り替え">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Part Navigation Pill Bar -->
  <nav class="part-nav" aria-label="パート選択">
    <div id="part-nav-inner" class="part-nav-inner">
      <!-- Generated by app.js -->
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Hero Banner for Selected Part -->
    <section class="hero-banner">
      <div class="hero-info">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
          <span id="hero-cat-badge" class="hero-badge badge-listening">Listening</span>
          <span id="hero-pageref" style="font-size: 0.8rem; color: var(--text-muted);">教科書 pp.70-71, 199</span>
        </div>
        <h1 id="hero-title">Listening 1 Part 1</h1>
        <div id="hero-topic" style="font-weight: 600; color: var(--primary); margin-bottom: 0.25rem;">Summer Plans & What is a Gap Year?</div>
        <p id="hero-desc" style="color: var(--text-muted); font-size: 0.9rem;">CaraとKotaroの夏休みの予定についての会話と、ギャップ・イヤーの紹介</p>
      </div>

      <!-- Global Audio Bar -->
      <div class="global-audio-bar">
        <button id="btn-play-all" class="btn-action" title="全文を最初から再生">
          <span>▶</span> 全文再生
        </button>
        <button id="btn-stop-all" class="btn-action" title="音声を停止">
          <span>⏹</span> 停止
        </button>
        <div style="display: flex; align-items: center; gap: 0.35rem; margin-left: 0.5rem;">
          <label for="speed-select" style="font-size: 0.8rem; color: var(--text-muted);">速度:</label>
          <select id="speed-select" class="speed-select">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Sub-Tab Navigation -->
    <div id="tab-container" class="tab-container">
      <!-- Tabs generated dynamically per part -->
    </div>

    <!-- Active Tab Dynamic Content -->
    <div id="tab-content">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Script files -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
