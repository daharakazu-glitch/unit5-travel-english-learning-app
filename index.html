<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 5: Listening 2 Part 1 & 2 | オンデマンド英語学習アプリ</title>
  <meta name="description" content="Unit 5 Listening 2 Part 1 & Part 2 自然なパラグラフ形式ディクテーション＆プロネイティブ音声付きオンデマンド英語学習アプリ">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo-group">
        <span class="logo-badge">UNIT 5</span>
        <div>
          <div class="app-title">What can we learn from traveling?</div>
          <div class="app-subtitle">Listening 2 Part 1 & Part 2 専用オンデマンド学習</div>
        </div>
      </div>
      <div class="header-controls">
        <div id="header-stats" class="stats-badge">
          🎯 記録: 読み込み中...
        </div>
        <button id="theme-toggle" class="btn-icon" title="テーマ切り替え" aria-label="テーマ切り替え">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Part Navigation Pill Bar (Listening 2 Part 1 & Part 2) -->
  <nav class="part-nav" aria-label="パート選択">
    <div id="part-nav-inner" class="part-nav-inner">
      <!-- Generated dynamically by app.js?v=2 -->
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Hero Banner for Selected Part -->
    <section class="hero-banner">
      <div class="hero-info">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; flex-wrap: wrap;">
          <span class="hero-badge">Listening 2</span>
          <span id="hero-pageref" style="font-size: 0.8rem; color: var(--text-muted);">教科書 p.77, 199 / 本文学習ノート pp.90-91</span>
          <span class="voice-badge-indicator">🎙️ プロ仕様ニューラルネイティブ音声収録</span>
        </div>
        <h1 id="hero-title">Listening 2 Part 1</h1>
        <div id="hero-topic" class="hero-topic">Gap-year scheme launched by another Japanese university.</div>
        <p id="hero-desc" style="color: var(--text-muted); font-size: 0.9rem;">トヨダ国際大学が来年度から学部生向けにギャップ・イヤーを導入する記者会見のニュース</p>
      </div>

      <!-- Global Audio Bar -->
      <div class="global-audio-bar">
        <button id="btn-play-all" class="btn-action" title="全文の自然なネイティブ音声を再生">
          <span>▶</span> 全文ネイティブ音声再生
        </button>
        <button id="btn-stop-all" class="btn-action" title="音声を停止">
          <span>⏹</span> 停止
        </button>
        <div style="display: flex; align-items: center; gap: 0.35rem; margin-left: 0.5rem;">
          <label for="speed-select" style="font-size: 0.8rem; color: var(--text-muted);">速度:</label>
          <select id="speed-select" class="speed-select">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Sub-Tab Navigation -->
    <div id="tab-container" class="tab-container">
      <!-- Tabs generated dynamically per part -->
    </div>

    <!-- Active Tab Dynamic Content -->
    <div id="tab-content">
      <!-- Injected by app.js?v=2 -->
    </div>
  </main>

  <!-- Script files -->
  <script src="data.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
